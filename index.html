
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لَمّة سنن | رفقة وأُنس وذكريات</title>

<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">

<style>
:root {
  --green: #102D27;
  --gold: #D7BD83;
  --white: #F8F7F1;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: 'Tajawal', sans-serif;
  background:
    radial-gradient(ellipse at 50% 20%, #245344 0%, transparent 60%),
    linear-gradient(135deg, #0B211C, #153C31 55%, #0B211C);
  color: var(--white);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  text-align: center;
}

body::before {
  content: "";
  position: fixed;
  inset: 20px;
  border: 1px solid rgba(215,189,131,.25);
  border-radius: 24px;
  pointer-events: none;
}

.container {
  width: 92%;
  max-width: 1100px;
  padding: 35px 15px;
  position: relative;
  z-index: 1;
}

.top-label {
  color: var(--gold);
  font-size: clamp(14px, 2vw, 19px);
  font-weight: 700;
  letter-spacing: 2px;
  margin-bottom: 28px;
}

.small-line {
  width: 75px;
  height: 2px;
  background: var(--gold);
  margin: 0 auto 25px;
}

h1 {
  font-size: clamp(55px, 10vw, 105px);
  font-weight: 900;
  color: var(--white);
  margin: 0;
  line-height: 1.25;
  text-shadow: 0 5px 35px rgba(0,0,0,.25);
}

.subtitle {
  color: var(--gold);
  font-size: clamp(21px, 3.5vw, 34px);
  font-weight: 700;
  margin-top: 10px;
}

.description {
  color: #E2E9E2;
  font-size: clamp(16px, 2.3vw, 23px);
  margin-top: 18px;
  line-height: 1.8;
}

.countdown-title {
  color: var(--gold);
  font-size: clamp(18px, 2.5vw, 25px);
  margin-top: 48px;
  margin-bottom: 22px;
  font-weight: 700;
}

.countdown {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 15px;
  max-width: 850px;
  margin: auto;
}

.unit {
  background: rgba(255,255,255,.07);
  border: 1px solid rgba(215,189,131,.4);
  border-radius: 18px;
  padding: 20px 8px;
  backdrop-filter: blur(8px);
}

.number {
  font-size: clamp(38px, 7vw, 72px);
  font-weight: 900;
  color: var(--gold);
  line-height: 1.2;
  font-variant-numeric: tabular-nums;
}

.unit-label {
  font-size: clamp(14px, 2vw, 20px);
  color: #FFFFFF;
  margin-top: 10px;
  font-weight: 700;
}

.event-date {
  margin-top: 35px;
  color: var(--gold);
  font-size: clamp(17px, 2.4vw, 23px);
  font-weight: 700;
}

/* الرسائل المتجددة */

.message-box {
  min-height: 65px;
  margin-top: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 8px;
}

.message {
  color: #F5E7C5;
  font-size: clamp(19px, 3vw, 29px);
  font-weight: 800;
  line-height: 1.6;
  opacity: 1;
  transform: translateY(0);
  transition: opacity .65s ease, transform .65s ease;
}

.message.fade-out {
  opacity: 0;
  transform: translateY(12px);
}

.footer {
  margin-top: 24px;
  color: #D7E0D9;
  font-size: clamp(13px, 1.8vw, 18px);
}
/* المؤثرات الحركية الأنيقة */

@keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(25px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes lineGrow {
  from { width: 0; opacity: 0; }
  to { width: 75px; opacity: 1; }
}

@keyframes softGlow {
  0%, 100% {
    box-shadow: 0 0 8px rgba(215,189,131,.08);
  }
  50% {
    box-shadow: 0 0 22px rgba(215,189,131,.22);
  }
}

.container > * {
  animation: fadeUp .9s ease both;
}

.top-label { animation-delay: .1s; }
.small-line {
  animation: lineGrow 1s ease .25s both;
}
h1 { animation-delay: .4s; }
.subtitle { animation-delay: .55s; }
.description { animation-delay: .7s; }
.countdown-title { animation-delay: .85s; }

.unit {
  animation: fadeUp .8s ease both, softGlow 4s ease-in-out 2s infinite;
  transition: transform .3s ease, border-color .3s ease;
}

.unit:nth-child(1) { animation-delay: 1s, 2s; }
.unit:nth-child(2) { animation-delay: 1.15s, 2s; }
.unit:nth-child(3) { animation-delay: 1.3s, 2s; }
.unit:nth-child(4) { animation-delay: 1.45s, 2s; }

.unit:hover {
  transform: translateY(-5px);
  border-color: var(--gold);
}

.event-date { animation-delay: 1.6s; }
.message-box { animation-delay: 1.8s; }
.footer { animation-delay: 2s; }

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
}
@media(max-width:600px) {
  .countdown { gap: 7px; }
  .unit { padding: 16px 3px; border-radius: 12px; }
  .container { padding: 20px 5px; }
  .countdown-title { margin-top: 35px; }
}
</style>
</head>

<body>

<div class="container">

  <div class="top-label">جمعية سنن التعليمية</div>

  <div class="small-line"></div>

  <h1>لَمّة سنن</h1>

  <div class="subtitle">رِفقةٌ وأُنسٌ وذكريات</div>

  <div class="description">
    لقاء يجمعنا على المحبة والأخوة<br>
    لنصنع معاً ذكريات جميلة لا تُنسى
  </div>

  <div class="countdown-title">
    بقي على موعد لَمّة سنن
  </div>

  <div class="countdown">

    <div class="unit">
      <div class="number" id="days">00</div>
      <div class="unit-label">يوم</div>
    </div>

    <div class="unit">
      <div class="number" id="hours">00</div>
      <div class="unit-label">ساعة</div>
    </div>

    <div class="unit">
      <div class="number" id="minutes">00</div>
      <div class="unit-label">دقيقة</div>
    </div>

    <div class="unit">
      <div class="number" id="seconds">00</div>
      <div class="unit-label">ثانية</div>
    </div>

  </div>

  <div class="event-date">
    السبت | 28 نوفمبر 2026م | الساعة 6 مساءً
  </div>

  <div class="message-box">
    <div class="message" id="message">
      الصحبة الطيبة.. أجمل ما في الرحلة
    </div>
  </div>

  <div class="footer">
    بكم تكتمل اللمّة.. وبصحبتكم تحلو الرحلة
  </div>

</div>

<script>

// موعد الطلعة
const eventDate = new Date("2026-11-28T18:00:00+03:00").getTime();

// تحديث العداد
function updateCountdown() {

  const now = Date.now();
  const difference = eventDate - now;

  if (difference <= 0) {
    document.querySelector(".countdown-title").textContent =
      "حان موعد لَمّة سنن!";

    ["days", "hours", "minutes", "seconds"].forEach(id => {
      document.getElementById(id).textContent = "00";
    });

    return;
  }

  const days = Math.floor(difference / (1000 * 60 * 60 * 24));
  const hours = Math.floor((difference / (1000 * 60 * 60)) % 24);
  const minutes = Math.floor((difference / (1000 * 60)) % 60);
  const seconds = Math.floor((difference / 1000) % 60);

  document.getElementById("days").textContent = String(days).padStart(2, "0");
  document.getElementById("hours").textContent = String(hours).padStart(2, "0");
  document.getElementById("minutes").textContent = String(minutes).padStart(2, "0");
  document.getElementById("seconds").textContent = String(seconds).padStart(2, "0");
}

updateCountdown();
setInterval(updateCountdown, 1000);


// الرسائل التحفيزية المتجددة

const messages = [
  "الصحبة الطيبة.. أجمل ما في الرحلة",
  "هنا نلتقي، وهنا تُصنع أجمل الذكريات",
  "العلم يجمعنا، والأخوة تزيدنا قرباً",
  "أيام جميلة تبدأ بلقاء الأحبة",
  "لسنا مجرد زملاء برامج، بل رفقة تجمعنا المحبة",
  "بكم تكتمل اللمّة، وبصحبتكم تحلو الرحلة"
];

let messageIndex = 0;
const messageElement = document.getElementById("message");

setInterval(() => {

  messageElement.classList.add("fade-out");

  setTimeout(() => {

    messageIndex = (messageIndex + 1) % messages.length;

    messageElement.textContent = messages[messageIndex];

    messageElement.classList.remove("fade-out");

  }, 650);

}, 7000);

</script>

</body>
</html>
